<!-- Correspondence -->
<section id="contact">
    <h2>Correspondence</h2>
    <p>For academic inquiries, research collaborations, or laboratory placements, please transmit your message
        below or contact me directly via <a href="mailto:monowarhusainomi@gmail.com">email</a>.</p>

    <div class="correspondence-form">
        <form id="discord-form">
            <div class="form-group">
                <label for="sender-name">Investigator Name</label>
                <input type="text" id="sender-name" required placeholder="Dr. Jane Doe">
            </div>
            <div class="form-group">
                <label for="sender-email">Contact Email</label>
                <input type="email" id="sender-email" required placeholder="j.doe@university.edu">
            </div>
            <div class="form-group">
                <label for="message">Inquiry Details</label>
                <textarea id="message" required
                    placeholder="Please detail the nature of your correspondence..."></textarea>
            </div>
            <button type="submit" class="submit-btn" id="submit-btn">Transmit Message</button>
            <div id="form-status"></div>
        </form>
    </div>
</section>
